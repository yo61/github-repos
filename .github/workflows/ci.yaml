---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # terraform_fmt and terraform_validate shell out to `terraform`, and
      # terraform_docs to `terraform-docs`. Neither ships on the runner, so the
      # hooks would fail before linting anything.
      #
      # terraform_wrapper false: the wrapper shims `terraform` with a script
      # that captures stdout, which the hooks parse.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install terraform-docs
        env:
          VERSION: v0.24.0
        run: |
          set -euo pipefail
          curl -fsSL "https://terraform-docs.io/dl/${VERSION}/terraform-docs-${VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin terraform-docs
          chmod +x /usr/local/bin/terraform-docs
          terraform-docs --version

      # terraform_validate would need `terraform init` against the Stategraph
      # HTTP backend, whose address and API key are deliberately not in the
      # repo. The hook falls back to `init -backend=false`, which validates
      # syntax and provider schemas without touching state.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: 0.4.13
