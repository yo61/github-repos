---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--format, parsable, --strict]

  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt

  # Pinned rather than run from the environment: ubuntu-24.04 runners ship
  # shellcheck 0.9.0 and no shfmt at all, so a `system` hook would lint against
  # a different version in CI than locally.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  # args is not decoration: the hook's own default is `[--write]` alone, which
  # formats to shfmt's defaults rather than the house style. These four flags
  # are the same set ALE is configured with, so a file formatted on save passes
  # here unchanged — `-i 2` two-space indent, `-bn` binary operators may start a
  # line, `-ci` case arms indented under the case, `-sr` space after redirects.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-i, '2', -bn, -ci, -sr, -w]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 253d99053f80e4a368175e93b36edb662e7e5135 # frozen: v1.109.1
    hooks:
      - id: terraform_validate
      - id: terraform_fmt
      - id: terraform_docs

  - repo: local
    hooks:
      - id: repo-yaml-name-check
        name: Verify data/<org>/<repo>.yaml name field matches filename stem
        entry: scripts/check_repo_yaml_name.sh
        language: script
        files: ^data/[^/]+/[^/]+\.yaml$
      - id: ruleset-paywall-comment
        name: "Verify builtin_ruleset_names: [] cites the record that forces it"
        entry: scripts/check_ruleset_paywall_comment.sh
        language: script
        files: ^data/[^/]+/[^/]+\.yaml$
      - id: ruleset-paywall-comment-test
        name: Test the ruleset-paywall-comment guard against its fixtures
        entry: scripts/test_check_ruleset_paywall_comment.sh
        language: script
        pass_filenames: false
        files: ^scripts/(test_)?check_ruleset_paywall_comment\.sh$
