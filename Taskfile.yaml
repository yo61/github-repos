---
# https://taskfile.dev

version: '3'
silent: true

set: [errexit, nounset, pipefail]

vars:
  PLAN_FILE: tfplan

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  # backend.tf is a partial config: the http backend reads its address and
  # credentials from the environment. Fail with a usable message rather than
  # letting terraform prompt for a missing address or 401 on a missing key.
  preflight:
    internal: true
    cmds:
      - |
        if [ -z "${TF_HTTP_ADDRESS:-}" ]; then
          echo "ERROR: TF_HTTP_ADDRESS is not set." >&2
          echo >&2
          echo "backend.tf omits the state address on purpose. Supply it:" >&2
          echo "    export TF_HTTP_ADDRESS=\"https://app.stategraph.cloud/\\" >&2
          echo "        api/v1/states/backend/<state-uuid>\"" >&2
          exit 1
        fi
      - |
        if [ -z "${TF_HTTP_PASSWORD:-}" ]; then
          echo "ERROR: TF_HTTP_PASSWORD is not set." >&2
          echo >&2
          echo "The backend authenticates with the Stategraph API key as the" >&2
          echo "HTTP Basic password:" >&2
          echo "    export TF_HTTP_PASSWORD=\"\$STATEGRAPH_API_KEY\"" >&2
          exit 1
        fi
      - |
        if [ -f .terraform/terraform.tfstate ] && command -v jq >/dev/null 2>&1; then
          backend=$(jq -r '.backend.type // "none"' .terraform/terraform.tfstate)
          if [ "$backend" != "http" ]; then
            echo "ERROR: terraform is initialised with the '$backend' backend." >&2
            echo "Re-run 'task init' with backend_override.tf in place." >&2
            exit 1
          fi
        fi

  # An unmatched -target is only a soft warning, and the resulting empty plan
  # reads like "nothing to do". A data directory doesn't prove module.org_<org>
  # exists, but it's a cheap proxy that catches a plain typo in ORG before
  # terraform silently no-ops.
  org-guard:
    internal: true
    cmds:
      - |
        if [ -n "{{.ORG}}" ] && [ ! -d "data/{{.ORG}}" ]; then
          echo "ERROR: no data/{{.ORG}} directory; ORG must name a managed org." >&2
          exit 1
        fi

  init:
    desc: Initialise terraform against the Stategraph HTTP backend
    summary: >-
      Runs terraform init against the Stategraph HTTP backend. backend.tf is a partial config on purpose
      — it names no address — so TF_HTTP_ADDRESS and TF_HTTP_PASSWORD must be exported first, the password
      being the Stategraph API key used as HTTP Basic auth. The preflight guard checks both and prints
      the exact exports rather than letting terraform prompt for an address or 401 mid-plan.
    deps: [preflight]
    cmds:
      - terraform init

  plan:
    desc: Generate a plan file via `terraform plan` (ORG=<org> scopes it to one org)
    summary: >-
      Writes a plan to tfplan for apply to consume. ORG=<org> narrows it to one organisation by turning
      into -target=module.org_<org>, with hyphens converted to underscores. That path is guarded: an unmatched
      -target is only a soft warning in terraform, so a typo in ORG would otherwise produce an empty plan
      that reads like "nothing to do". The guard checks the module's data directory exists first — a cheap
      proxy, not proof, but it catches the typo.
    deps: [preflight, org-guard]
    vars:
      TARGET: '{{if .ORG}}-target=module.org_{{.ORG | replace "-" "_"}}{{end}}'
    cmds:
      - terraform plan -out={{.PLAN_FILE}} {{.TARGET}}

  apply:
    desc: Apply the previously generated plan file
    summary: >-
      Applies the plan file tfplan produced by `task plan`, so it applies exactly what was planned rather
      than re-planning. Run plan first; terraform refuses a saved plan whose state has moved on underneath
      it.
    deps: [preflight]
    cmds:
      - terraform apply {{.PLAN_FILE}}

  state:list:
    desc: List resource instance addresses in state
    summary: >-
      Lists every resource instance address in state — the raw addresses, for finding what to look at.
      state:show narrows it to one repo.
    deps: [preflight]
    cmds:
      - terraform state list

  state:show:
    desc: Show all resource instances for one repo (REPO=<name>)
    summary: >-
      Filters the state address list down to one repo's instances, and fails with a clear message rather
      than empty output when REPO names nothing in state. It reports addresses, not attribute values.
    deps: [preflight]
    requires:
      vars: [REPO]
    cmds:
      - |
        terraform state list | grep -F 'module.repo["{{.REPO}}"]' || {
          echo "No instances in state for repo '{{.REPO}}'." >&2
          exit 1
        }

  lockfile:sync:
    desc: Sync the lockfile for all supported platforms
    summary: >-
      Regenerates .terraform.lock.hcl with provider hashes for all four platforms this repo is used from:
      linux and darwin, amd64 and arm64. Without every platform present, terraform refuses to run wherever
      the hash is missing — which is how a lockfile written on a Mac breaks CI.
    cmds:
      - |
        terraform providers lock \
          -platform=linux_amd64 \
          -platform=darwin_amd64 \
          -platform=linux_arm64 \
          -platform=darwin_arm64
