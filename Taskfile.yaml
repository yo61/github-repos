---
# https://taskfile.dev

version: '3'
silent: true

set: [errexit, nounset, pipefail]

vars:
  PLAN_FILE: tfplan.json

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  # plan and apply go through the Stategraph CLI, which binds to the state named
  # by the gitignored stategraph.json and reads its endpoint, key and tenant
  # from the environment.
  preflight:stategraph:
    internal: true
    cmds:
      - |
        for var in STATEGRAPH_API_BASE STATEGRAPH_API_KEY STATEGRAPH_TENANT_ID; do
          if [ -z "$(printenv "$var")" ]; then
            echo "ERROR: $var is not set." >&2
            echo "The Stategraph CLI needs STATEGRAPH_API_BASE, STATEGRAPH_API_KEY" >&2
            echo "and STATEGRAPH_TENANT_ID (see \`stategraph user tenants list\`)." >&2
            exit 1
          fi
        done
      - |
        if [ ! -f stategraph.json ]; then
          echo "ERROR: stategraph.json is missing." >&2
          echo "Copy stategraph.json.example to stategraph.json and fill in the" >&2
          echo "state's group_id (\`stategraph states list\` shows it)." >&2
          exit 1
        fi

  plan:
    desc: Write a plan to tfplan.json via `stategraph tf plan`
    summary: >-
      Plans through the Stategraph CLI, which opens a transaction against the state named in stategraph.json;
      that transaction is what guards against concurrent changes. The plan is written to tfplan.json for
      apply to consume. --skip-costs drops the cost preview, which on these unpriced resources lists every
      one as removed (stategraph/releases#6).
    deps: ['preflight:stategraph']
    cmds:
      - stategraph tf plan --skip-costs --out {{.PLAN_FILE}}

  apply:
    desc: Apply tfplan.json via `stategraph tf apply`
    summary: >-
      Commits the plan written by `task plan`, so it applies exactly what was reviewed. Stategraph refuses
      a plan whose revision no longer matches the state.
    deps: ['preflight:stategraph']
    cmds:
      - stategraph tf apply {{.PLAN_FILE}}

  # Without --paginate the server returns its default 20 rows and only says so
  # on stderr. The state id is resolved in cmds, not vars: vars are evaluated
  # before deps, which would skip the preflight's message.
  state:list:
    desc: List resource instance addresses in state
    summary: >-
      Lists every resource instance address in state — the raw addresses, for finding what to look at.
      state:show narrows it to one repo.
    deps: ['preflight:stategraph']
    cmds:
      - |
        state_id=$(stategraph states resolve)
        stategraph sql query --format simple --paginate \
          "SELECT address FROM instances WHERE state_id = '$state_id' ORDER BY address"

  state:show:
    desc: Show all resource instances for one repo (REPO=<name>)
    summary: >-
      Filters the state address list down to one repo's instances, and fails with a clear message rather
      than empty output when REPO names nothing in state. It reports addresses, not attribute values.
    deps: ['preflight:stategraph']
    requires:
      vars: [REPO]
    env:
      REPO: '{{.REPO}}'
    cmds:
      - |
        if ! printf '%s' "$REPO" | grep -Eq '^[A-Za-z0-9._-]+$'; then
          echo "REPO must be a repository name, got '$REPO'." >&2
          exit 1
        fi
      - |
        state_id=$(stategraph states resolve)
        stategraph sql query --format simple --paginate \
          "SELECT address FROM instances WHERE state_id = '$state_id' ORDER BY address" \
          | grep -F "module.repo[\"$REPO\"]" || {
          echo "No instances in state for repo '$REPO'." >&2
          exit 1
        }

  lockfile:sync:
    desc: Sync the lockfile for all supported platforms
    summary: >-
      Regenerates .terraform.lock.hcl with provider hashes for all four platforms this repo is used from:
      linux and darwin, amd64 and arm64. Without every platform present, terraform refuses to run wherever
      the hash is missing — which is how a lockfile written on a Mac breaks CI.
    cmds:
      - |
        terraform providers lock \
          -platform=linux_amd64 \
          -platform=darwin_amd64 \
          -platform=linux_arm64 \
          -platform=darwin_arm64
