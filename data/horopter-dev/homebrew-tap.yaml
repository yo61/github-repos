---
allow_auto_merge: true
allow_update_branch: false
collaborators:
  teams:
    - permission: admin
      slug: admins
# horopter's release pushes casks straight to main with a token from the
# horopter-semantic-release-pusher App, which the pull_request rule would
# refuse. A per-repo list replaces the org default, so the admin role is
# restated.
default_branch_ruleset_bypass_actors:
  - actor_id: 5196299
    actor_type: Integration
    bypass_mode: always
  - actor_id: 5
    actor_type: RepositoryRole
    bypass_mode: always
dependabot_security_updates: true
description: "Homebrew tap for horopter tools"
has_issues: true
has_wiki: true
name: homebrew-tap
topics:
  - homebrew
  - homebrew-tap
  - macos
  - packaging
visibility: public
vulnerability_alerts: true
