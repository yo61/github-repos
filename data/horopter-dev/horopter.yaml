---
# Release tags: only the release App (horopter-semantic-release-pusher,
# Integration 5196299) and admins may create, move or delete them (horopter
# HOR-7). A ruleset naming its own bypass_actors replaces the org default, so
# the admin role is restated.
additional_rulesets:
  release_tags:
    enforcement: active
    name: Release tags
    target: tag
    conditions:
      - ref_name:
          exclude: []
          include:
            - refs/tags/v*
    rules:
      - creation: true
        deletion: true
        non_fast_forward: true
        required_signatures: false
        update: true
        update_allows_fetch_and_merge: false
    bypass_actors:
      - actor_id: 5196299
        actor_type: Integration
        bypass_mode: always
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
collaborators:
  teams:
    - permission: admin
      slug: admins
dependabot_security_updates: true
description: "System of record for infrastructure change — what changed, when, and to what, as one replayable
  timeline."
has_issues: true
name: horopter
topics:
  - infrastructure
  - change-management
  - audit-trail
  - go
visibility: public
vulnerability_alerts: true
