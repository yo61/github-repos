---
additional_rulesets:
  required_status_checks:
    enforcement: active
    name: Required status checks
    target: branch
    conditions:
      - ref_name:
          exclude: []
          include:
            - ~DEFAULT_BRANCH
    rules:
      - creation: false
        deletion: false
        non_fast_forward: false
        required_signatures: false
        update: false
        update_allows_fetch_and_merge: false
        required_status_checks:
          do_not_enforce_on_create: true
          strict_required_status_checks_policy: false
          required_check:
            - context: Conventional Commits
            - context: plugin.json validation
            - context: lint
allow_auto_merge: true
allow_update_branch: false
dependabot_security_updates: true
description: "Claude Code plugin: keep every pinned dependency current with Dependabot and self-hosted
  Renovate, one owner per pin, and audit a repository against that rule."
has_issues: true
has_wiki: true
name: claude-plugin-dependency-updates
topics:
  - claude-code
  - claude-code-plugin
  - dependabot
  - renovate
  - dependencies
visibility: public
vulnerability_alerts: true
