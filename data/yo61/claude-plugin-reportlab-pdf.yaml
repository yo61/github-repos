---
additional_rulesets:
  required_status_checks:
    enforcement: active
    name: Required status checks
    target: branch
    conditions:
      - ref_name:
          exclude: []
          include:
            - ~DEFAULT_BRANCH
    rules:
      - creation: false
        deletion: false
        non_fast_forward: false
        required_signatures: false
        update: false
        update_allows_fetch_and_merge: false
        required_status_checks:
          strict_required_status_checks_policy: false
          required_check:
            - context: Conventional Commits
            - context: plugin.json validation
            - context: lint
allow_update_branch: false
default_branch_ruleset_required_approving_review_count: 1
delete_branch_on_merge: true
dependabot_security_updates: true
description: "Claude Code plugin: ReportLab-based PDF generation. Programmatic Platypus PDFs (CVs, invoices,
  reports) and a markdown-to-PDF renderer (mistune + Platypus)."
has_issues: true
has_projects: true
has_wiki: true
name: claude-plugin-reportlab-pdf
visibility: public
vulnerability_alerts: true
