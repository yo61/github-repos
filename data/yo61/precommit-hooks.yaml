---
additional_rulesets:
  required_status_checks:
    enforcement: active
    name: Required status checks
    target: branch
    conditions:
      - ref_name:
          exclude: []
          include:
            - ~DEFAULT_BRANCH
    rules:
      - creation: false
        deletion: false
        non_fast_forward: false
        required_signatures: false
        update: false
        update_allows_fetch_and_merge: false
        required_status_checks:
          strict_required_status_checks_policy: false
          required_check:
            # `test` aggregates lint and the pytest matrix, so the matrix can change freely.
            - context: test
            - context: commitlint
dependabot_security_updates: true
description: "Shared pre-commit hooks, run with prek, for repositories across Robin's orgs"
has_issues: true
name: precommit-hooks
security_and_analysis:
  secret_scanning: true
  secret_scanning_push_protection: true
topics:
  - pre-commit
  - pre-commit-hooks
  - prek
visibility: public
vulnerability_alerts: true
