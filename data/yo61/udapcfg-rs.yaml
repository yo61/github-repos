---
additional_rulesets:
  required_status_checks:
    enforcement: active
    name: Required status checks
    target: branch
    conditions:
      - ref_name:
          exclude: []
          include:
            - ~DEFAULT_BRANCH
    rules:
      - creation: false
        deletion: false
        non_fast_forward: false
        required_signatures: false
        update: false
        update_allows_fetch_and_merge: false
        required_status_checks:
          strict_required_status_checks_policy: false
          required_check:
            - context: check
            - context: lint
            - context: Conventional Commits
allow_auto_merge: true
collaborators:
  users:
    - permission: admin
      username: robinbowes
dependabot_security_updates: true
description: "Rust port of go-udap: discover and configure Squeezebox devices over UDAP."
has_issues: true
name: udapcfg-rs
visibility: public
vulnerability_alerts: true
