---
additional_rulesets:
  required_status_checks:
    enforcement: active
    name: Required status checks
    target: branch
    conditions:
      - ref_name:
          exclude: []
          include:
            - ~DEFAULT_BRANCH
    rules:
      - creation: false
        deletion: false
        non_fast_forward: false
        required_signatures: false
        update: false
        update_allows_fetch_and_merge: false
        required_status_checks:
          strict_required_status_checks_policy: false
          required_check:
            - context: Site
            - context: Hooks
dependabot_security_updates: true
description: "The yo61.com website, www.yo61.com"
# Cloudflare deploy secrets live on these, so only main's workflow runs reach them.
environments:
  preview:
    deployment_branches:
      - main
  production:
    deployment_branches:
      - main
has_issues: true
homepage_url: https://www.yo61.com
name: www-yo61-com
topics:
  - cloudflare-pages
  - website
visibility: public
vulnerability_alerts: true
